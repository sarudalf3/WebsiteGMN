<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="meta.title">GMN Group | Consultores Expertos</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <!--navbar-->
    <header id="navbar">
        <div class="navbar-container">
            <!-- Left: Logo -->
            <div class="logo">
                <a href="#home" class="logo-link">
                    <img src="/img/logo.webp" alt="GMN Group Logo">
                    <div class="logo-text">
                        <span class="brand-name"><h1>GMN Group</h1></span>
                        <span class="brand-tagline" data-key="nav.navbar0"><h5></h5></span>
                    </div>
                </a>
            </div>

            <!-- Center: Navigation -->
            <nav class="navbar-nav">
                <ul class="nav-links">
                    <li><a href="#inicio" data-key="nav.navbar1"></a></li>
                    <li><a href="#overview" data-key="title.overview"></a></li>
                    <li><a href="#news" data-key="title.news"></a></li>
                    <li><a href="#quienes" data-key="nav.navbar2"></a></li>
                    <li><a href="#quehacemos-intro" data-key="nav.navbar3"></a></li>
                    <li><a href="#logros" data-key="nav.navbar4"></a></li>
                    <li><a href="#filosofia" data-key="nav.navbar5"></a></li>
                    <li><a href="#contacto" data-key="nav.navbar6"></a></li>
                </ul>
            </nav>

            <!-- Right: Language & Toggle -->
            <div class="navbar-right">
                <!--<button class="navbar-toggle" aria-label="Toggle navigation">☰</button>-->
                <div class="navbar-lang">
                    <select id="language-selector"  class="lang-select">
                        <option value="esp" selected>ESP</option>
                        <option value="eng">ENG</option>
                        <option value="prt">PRT</option>
                    </select>
                </div>
            </div> 
        </div>
    </header>

<main>
    <!--Initial Section-->
    <section id="home" class="slide hero">
        <video autoplay muted loop playsinline class="bg-video">
        <source src="https://res.cloudinary.com/dech95yov/video/upload/f_auto,q_auto:best/Portada_xytqox.mp4" type="video/mp4" />
        </video>

        <div class="overlay">
            <h1><p5 data-key="home.hero.title1"></p5></span></h1>
            <h1><p5 class="highlight-orange" data-key="home.hero.title2"></p5></h1>
            <p1><p5 data-key="home.hero.subtitle"></p5></p1>
        </div>
    </section>





<section id="exitos" class="exitos container">
        <h2 data-key="servicios.title">Casos de Éxito</h2>
        <div class="carousel-container">
            <button class="prev-btn">❮</button>
            <div class="main-display">
                </div>
            <button class="next-btn">❯</button>
        </div>
    </section>

    <section id="contacto" class="container">
        <h2 data-key="nav.contacto">Contacto</h2>
        <form action="/send-mail" method="POST" class="contact-form">
            <input type="text" name="name" placeholder="Nombre" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Mensaje"></textarea>
            <button type="submit" data-key="form.buttons.send_postulation">Enviar</button>
        </form>
    </section>
</main>

    <div id="modal-services" class="modal-services" style="display: none;">
        <div class="modal-services__overlay"></div>
        <div class="modal-services__content">
            <button class="modal-services__close">&times;</button>
            <h3 class="modal-services__title"></h3>
            <div class="modal-services__body"></div>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
